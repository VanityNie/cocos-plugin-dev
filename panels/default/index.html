<div id="app">
  <header class="panel-toolbar">
    <div class="toolbar-title">
      <h1>插件开发</h1>
      <span id="host-mode-badge" class="badge">当前项目</span>
      <code id="project-path" class="summary-meta" title="当前操作目标宿主目录">正在连接编辑器…</code>
    </div>
    <div class="toolbar-actions">
      <button id="toggle-host" class="quiet" type="button">切换项目</button>
      <button id="refresh" class="quiet" type="button">刷新</button>
    </div>
  </header>

  <div id="notice" role="status" aria-live="polite"></div>

  <details id="host-details" class="panel-section host-drawer">
    <summary class="sr-summary">切换游戏宿主</summary>
    <div class="section-body">
      <div class="prop-row readonly-prop">
        <span class="prop-label">当前编辑器</span>
        <code id="editor-project-path" class="prop-code">正在连接编辑器…</code>
      </div>
      <form id="host-form" class="prop-stack">
        <label class="prop-row">
          <span class="prop-label">目标宿主目录</span>
          <span class="prop-control inline-group">
            <input id="host-path" placeholder="已有 Creator 游戏项目目录" required autocomplete="off" data-mutation />
            <button id="browse-host" type="button" data-mutation>选择目录</button>
          </span>
        </label>
        <div class="prop-actions">
          <p id="host-note" class="hint"></p>
          <div class="toolbar">
            <button type="submit" class="primary" data-mutation>切换宿主</button>
            <button id="use-editor-host" type="button" data-mutation>使用当前编辑器项目</button>
          </div>
        </div>
      </form>
    </div>
  </details>

  <section class="panel-section">
    <div class="section-header">
      <div class="summary-title">
        <span class="step">1</span>
        <h2>插件管理</h2>
        <span id="plugin-count" class="subtle badge"></span>
      </div>
      <div class="toolbar">
        <span id="create-summary-note" class="subtle"></span>
        <button id="toggle-create" class="quiet" type="button">+ 添加插件</button>
      </div>
    </div>

    <div class="section-body">
      <details id="create-details" class="add-drawer" open>
        <summary class="sr-summary">创建或引用插件</summary>
        <div class="mode-tabs">
          <button type="button" class="tab-btn active" data-tab="create">新建 TS + C++ 插件</button>
          <button type="button" class="tab-btn" data-tab="link">关联已有插件源码</button>
        </div>

        <form id="create-form" class="tab-pane">
          <label class="prop-row">
            <span class="prop-label">插件标识</span>
            <input id="plugin-name" placeholder="neural-render（小写字母、数字、连字符）" pattern="[a-z][a-z0-9-]*" required maxlength="64" autocomplete="off" data-mutation />
          </label>
          <label class="prop-row">
            <span class="prop-label">显示名称</span>
            <input id="display-name" placeholder="神经网络渲染（可选）" maxlength="100" autocomplete="off" data-mutation />
          </label>
          <label class="prop-row">
            <span class="prop-label">插件模板</span>
            <select id="template" data-mutation>
              <option value="native">原生能力 · TS ↔ C++</option>
              <option value="render">渲染扩展 · 自定义 Pass 骨架</option>
            </select>
          </label>
          <label class="prop-row">
            <span class="prop-label">源码位置</span>
            <select id="plugin-location" data-mutation>
              <option value="independent">独立插件项目（推荐，可多宿主复用）</option>
              <option value="embedded">所选宿主 extensions 内</option>
            </select>
          </label>
          <div id="independent-location" class="prop-row">
            <label class="prop-label" for="plugin-path">新建插件目录</label>
            <div class="prop-control inline-group">
              <input id="plugin-path" placeholder="E:\code\work\neural-render" required autocomplete="off" data-mutation />
              <button id="browse-plugin-parent" type="button" data-mutation>选择上级目录</button>
            </div>
          </div>
          <div class="prop-actions">
            <span class="hint">自动生成 TS/C++ 模板与类型声明并关联到当前目标宿主。</span>
            <button type="submit" class="primary" data-mutation>创建并引用到宿主</button>
          </div>
        </form>

        <form id="link-form" class="tab-pane inactive-pane">
          <label class="prop-row">
            <span class="prop-label">已有源码目录</span>
            <span class="prop-control inline-group">
              <input id="source-path" placeholder="包含 plugin-dev.json 的独立插件目录" required autocomplete="off" data-mutation />
              <button id="browse-source" type="button" data-mutation>选择目录</button>
            </span>
          </label>
          <div class="prop-actions">
            <span class="hint">源码修改会自动同步到当前宿主运行时副本。</span>
            <button type="submit" class="primary" data-mutation>添加开发引用</button>
          </div>
        </form>
      </details>

      <div id="plugins"><p class="empty">正在读取插件…</p></div>
    </div>
  </section>

  <section class="panel-section">
    <div class="section-header">
      <div class="summary-title">
        <span class="step">2</span>
        <h2>Windows 构建与调试</h2>
      </div>
      <label class="checkbox" title="勾选后构建前会先构建更新 TS 脚本、场景和资源；仅修改 C++ 源码时可取消勾选以加快编译">
        <input id="refresh-assets" type="checkbox" checked />
        <span>同步构建 TS 与资源</span>
      </label>
    </div>

    <div class="section-body debug-body">
      <div class="workflow-bar">
        <select id="ide" data-mutation aria-label="开发环境">
          <option value="vscode">VS Code · CMake / clangd</option>
          <option value="visual-studio">Visual Studio · 解决方案</option>
        </select>
        <button type="button" data-action="debug" data-mutation title="立即打开插件源码与宿主类型环境，无需先构建游戏">打开开发工作区</button>
        <span class="flow-arrow" aria-hidden="true">➔</span>
        <button type="button" data-action="build-run" class="primary" data-mutation title="自动生成测试场景、准备宿主、编译并运行插件">构建并运行</button>
        <button type="button" data-action="stop" class="ml-auto" data-mutation title="停止当前运行中的游戏进程">停止游戏</button>
      </div>

      <details id="settings-details" class="sub-details">
        <summary>环境设置与更多操作</summary>
        <div class="settings">
          <div class="prop-row">
            <span class="prop-label">更多操作</span>
            <div class="toolbar">
              <button type="button" data-action="build" data-mutation>仅构建</button>
              <button type="button" data-action="prepare" data-mutation>重新准备宿主资源</button>
              <button type="button" data-action="run" data-mutation>运行现有构建</button>
              <button type="button" data-action="restart" data-mutation>重启游戏</button>
              <button type="button" data-action="configure" data-mutation>重新配置</button>
              <button type="button" data-action="doctor" data-mutation>检查环境</button>
            </div>
          </div>
          <div class="divider"></div>
          <p id="engine-error" class="error-message" role="status" hidden></p>
          <label class="prop-row">
            <span class="prop-label">引擎源码目录</span>
            <input id="engine-path" placeholder="引擎根目录，如 E:\engines\cocos-engine" autocomplete="off" />
          </label>
          <label class="prop-row">
            <span class="prop-label">Creator 路径</span>
            <input id="creator-path" placeholder="留空自动检测；或填 CocosCreator.exe 路径" autocomplete="off" />
          </label>
          <label class="prop-row">
            <span class="prop-label">插件导出目录</span>
            <input id="output-dir" placeholder="默认 .plugin-dev/packages" autocomplete="off" />
          </label>
          <label class="prop-row">
            <span class="prop-label">C++ 构建配置</span>
            <select id="build-type">
              <option value="Debug">Debug（完整调试符号 · 禁用优化）</option>
              <option value="RelWithDebInfo">RelWithDebInfo（带符号优化 · 性能分析）</option>
              <option value="Release">Release（发布级优化）</option>
            </select>
          </label>
          <div class="prop-actions">
            <span class="hint">每个宿主独立保存在各自的 .plugin-dev 目录中。</span>
            <button id="save-settings" type="button" data-mutation>保存设置</button>
          </div>
        </div>
      </details>
    </div>
  </section>

  <section class="panel-section log-section">
    <div class="section-header">
      <div class="summary-title">
        <h2>操作日志</h2>
        <span id="task-detail" class="subtle log-detail">就绪</span>
      </div>
      <div class="task-controls">
        <button id="cancel-task" class="danger" type="button" hidden>取消任务</button>
        <span id="task-status" class="status">就绪</span>
      </div>
    </div>
    <div class="section-body log-body">
      <pre id="log" tabindex="0" role="log" aria-live="polite" aria-relevant="additions text" aria-label="插件开发与游戏运行日志">等待操作。</pre>
    </div>
  </section>
</div>
